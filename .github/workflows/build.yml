# Builds Hawk for Windows from a commit on main, on demand.
# Run it from the Actions tab: "Commit build" > "Run workflow". Leave the
# commit as HEAD for the latest commit on main, or enter a hash (7+ chars).
# Produces two unzipped artifacts:
#   hawk-<short-hash>-Windows-x64.exe        (standalone executable)
#   hawk-<short-hash>-Windows-x64-Setup.exe  (NSIS installer)

name: Commit build

on:
  workflow_dispatch:
    inputs:
      commit:
        description: "Commit on main: HEAD for the latest, or a hash (7+ characters)"
        required: true
        default: HEAD
        type: string

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build-windows:
    runs-on: windows-latest
    env:
      # Read through an env var, never pasted into scripts, so the input
      # can't inject shell code.
      COMMIT: ${{ inputs.commit }}

    steps:
      - name: Check commit format
        shell: pwsh
        run: |
          $ref = $env:COMMIT.Trim()
          if ($ref -ine 'HEAD' -and $ref -notmatch '^[0-9a-fA-F]{7,40}$') {
            throw "Commit must be HEAD or a hash of 7-40 hex characters, got '$env:COMMIT'"
          }

      # Full history of main, so a commit can be looked up and checked.
      - name: Check out main
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: Resolve and check out the commit
        shell: pwsh
        run: |
          $ref = $env:COMMIT.Trim()
          if ($ref -ieq 'HEAD') { $ref = 'origin/main' }
          $sha = git rev-parse --verify --quiet "$ref^{commit}"
          if ($LASTEXITCODE -ne 0 -or -not $sha) {
            throw "Commit '$env:COMMIT' not found, or the short hash matches more than one commit"
          }
          git merge-base --is-ancestor $sha origin/main
          if ($LASTEXITCODE -ne 0) { throw "Commit $sha is not on main" }
          git checkout --quiet --detach $sha
          if ($LASTEXITCODE -ne 0) { throw "Could not check out $sha" }
          $short = $sha.Substring(0, 7)
          Add-Content $env:GITHUB_ENV "SHORT_SHA=$short"
          "Building commit $sha" >> $env:GITHUB_STEP_SUMMARY

      # Embedded source paths show as ~ instead of the runner's home folder.
      # Set before the cache step, which keys on RUSTFLAGS.
      - name: Remap local paths
        shell: pwsh
        run: Add-Content $env:GITHUB_ENV "RUSTFLAGS=--remap-path-prefix=$env:USERPROFILE=~"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Run tests
        run: cargo test --manifest-path src-tauri/Cargo.toml --locked

      - name: Build app and installer
        run: npx --yes @tauri-apps/cli@2 build

      - name: Rename outputs
        shell: pwsh
        run: |
          # The installer is named after the version in tauri.conf.json.
          $version = (Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item src-tauri/target/release/hawk.exe "dist/hawk-$env:SHORT_SHA-Windows-x64.exe"
          $setup = @(Get-ChildItem "src-tauri/target/release/bundle/nsis/Hawk_${version}_x64-setup.exe")
          if ($setup.Count -ne 1) { throw "Expected one installer, found $($setup.Count)" }
          Copy-Item $setup[0].FullName "dist/hawk-$env:SHORT_SHA-Windows-x64-Setup.exe"

          # SHA-256 checksums.
          "### SHA-256" >> $env:GITHUB_STEP_SUMMARY
          '```' >> $env:GITHUB_STEP_SUMMARY
          Get-ChildItem dist/*.exe | Get-FileHash -Algorithm SHA256 |
            ForEach-Object { "$($_.Hash.ToLower())  $(Split-Path $_.Path -Leaf)" } |
            Tee-Object -Append -FilePath $env:GITHUB_STEP_SUMMARY
          '```' >> $env:GITHUB_STEP_SUMMARY

      # One artifact per file, uploaded unzipped (archive: false allows only a
      # single file, and the artifact takes the file's name).
      - name: Upload executable
        uses: actions/upload-artifact@v7
        with:
          path: dist/hawk-${{ env.SHORT_SHA }}-Windows-x64.exe
          archive: false
          if-no-files-found: error

      - name: Upload installer
        uses: actions/upload-artifact@v7
        with:
          path: dist/hawk-${{ env.SHORT_SHA }}-Windows-x64-Setup.exe
          archive: false
          if-no-files-found: error
