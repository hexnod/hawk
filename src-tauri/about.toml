# cargo-about config for THIRD-PARTY-NOTICES.txt (see README).
# Only crates compiled into hawk.exe for Windows; build/dev deps aren't shipped.
targets = ["x86_64-pc-windows-msvc"]
ignore-build-dependencies = true
ignore-dev-dependencies = true
# Skip Hawk itself (publish = false).
private = { ignore = true }
# Licenses allowed, in order of preference for multi-licensed crates.
accepted = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "0BSD",
    "BSL-1.0",
    "CC0-1.0",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "MPL-2.0",
    "Unlicense",
]
